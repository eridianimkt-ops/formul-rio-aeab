<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            aeab: {
              navy: '#0C2A47',
              navyLight: '#153E66',
              green: '#5F8518',
              lime: '#7CB52E',
              bg: '#F4F5F0',
              card: '#FFFFFF',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #F4F5F0;
      color: #1E293B;
    }

    /* Transições suaves e estilo Google Forms institucional */
    .form-card {
      background: #FFFFFF;
      border-radius: 14px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 2px 10px rgba(12, 42, 71, 0.04);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .form-card:focus-within {
      border-color: #7CB52E;
      box-shadow: 0 4px 16px rgba(12, 42, 71, 0.08);
    }

    .input-field {
      width: 100%;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #0F172A;
      background-color: #FAFAFA;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: #0C2A47;
      box-shadow: 0 0 0 3px rgba(124, 181, 46, 0.25);
    }

    .input-error {
      border-color: #DC2626 !important;
      background-color: #FEF2F2 !important;
    }

    /* Custom Checkbox & Radio cards */
    .option-card {
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .option-card:hover {
      border-color: #94A3B8;
      background-color: #F8FAFC;
    }

    .option-card.selected {
      border-color: #5F8518;
      background-color: rgba(124, 181, 46, 0.08);
    }

    /* Banner com Casa de Barro em segundo plano e malha arquitetônica */
    .hero-banner-bg {
      background:
        linear-gradient(135deg, rgba(12, 42, 71, 0.72) 0%, rgba(12, 42, 71, 0.35) 55%, rgba(95, 133, 24, 0.45) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 28px);
    }

    .glass-panel {
      background: rgba(12, 42, 71, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(124, 181, 46, 0.65);
      box-shadow: 0 12px 32px rgba(6, 20, 36, 0.45);
    }

    @media print {
      body {
        background: #FFFFFF !important;
      }
      .no-print {
        display: none !important;
      }
      .form-card {
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
      }
    }
  </style>
</head>
